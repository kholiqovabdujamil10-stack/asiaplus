{% extends 'basic.html' %}

{% block content %}

<div class="form-container">
    <h1 class="form-title">Добавить новость</h1>

    <form method="POST" enctype="multipart/form-data" class="main-form">
        {% csrf_token %}

        <label class="form-label">Заголовок</label>
        <input type="text" name="title" class="form-input" required>

        <label class="form-label">Краткое описание</label>
        <textarea name="caption" class="form-textarea" required></textarea>

        <label class="form-label">Текст новости</label>
        <textarea name="text" class="form-textarea large-textarea" required></textarea>

        <label class="form-label">Категория</label>
        <select name="category" class="form-input" required>
            {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>

        <label class="form-label">Фотография</label>
        <input type="file" name="image" class="form-input" accept="image/*" required>

        <button type="submit" class="submit-button">Опубликовать</button>
    </form>
</div>

{% endblock %}
